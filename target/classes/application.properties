spring.application.name=exemplo2

# URL de conexão do banco de dados
spring.datasource.url=jdbc:h2:mem:bancoteste
# Define o usuário padrão do banco de dados
spring.datasource.username=sa
# Define a senha do usuário padrão (vazia por padrão)
spring.datasource.password=

# Habilita o console do H2
spring.h2.console.enable=true
# Define a URL do console
spring.h2.console.path=/h2-console

# Para o h2 funcionar no codespaces
spring.h2.console.settings.web-allow-others=true
server.forward-headers-strategy=framework

# Configura o JPA para atualizar a estrutura do banco
# automaticamente baseado nas classes do java
spring.jpa.hibernate.ddl-auto=update